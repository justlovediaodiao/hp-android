name: Build and Release APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: proxy-go/go.mod
          cache-dependency-path: proxy-go/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'

      - name: Set Android NDK environment
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Go mobile tools
        working-directory: proxy-go
        run: |
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build native libraries
        run: bash ./scripts/build-native.sh

      - name: Build APK
        run: bash ./gradlew --no-daemon assembleRelease

      - name: Sign APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$keystore"' EXIT
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$keystore"

          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p build/release
          "$build_tools/zipalign" -P 16 -f -v 4 \
            build/app/outputs/apk/release/app-release-unsigned.apk \
            build/release/hp-vpn.apk
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ALIAS" \
            --ks-pass env:KEY_STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            build/release/hp-vpn.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hp-vpn-apk
          path: build/release/hp-vpn.apk
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/release/hp-vpn.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
